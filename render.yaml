services:
  - type: web
    name: voiceiq-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=2 --threads=4 --timeout=120 --bind=0.0.0.0:$PORT api.app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
